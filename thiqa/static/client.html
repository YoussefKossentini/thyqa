<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thiqa · Sboui</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0b1020; --panel:#121a30; --line:#24304f; --text:#e6ebf5; --muted:#8b97b3; --me:#1d4f6b; --bot:#14301f; --block:#7f1d1d; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; display:flex; justify-content:center; }
  .app { width:100%; max-width:520px; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  header b { font-size:17px; } header small { color:var(--muted); display:block; font-size:12px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid #6b4a12; color:#fcd34d; margin-left:auto; white-space:nowrap; }
  #hackBar { display:none; background:#2a0f14; border-bottom:1px solid #7f1d1d; padding:10px 14px; font-size:14px; }
  #hackBar b { color:#fca5a5; } #score { display:flex; gap:12px; margin-top:6px; font-size:13px; color:#fecaca; flex-wrap:wrap; }
  #consent { background:#1e293b; border-bottom:1px solid var(--line); padding:10px 14px; font-size:13px; display:none; }
  #chat { flex:1; min-height:0; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:9px 12px; border-radius:14px; white-space:pre-wrap; word-break:break-word; }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .withheld { align-self:flex-end; background:var(--block); font-style:italic; }
  .meta { font-size:10px; color:var(--muted); margin-top:3px; }
  .offer { align-self:stretch; border:1px solid #1d4f6b; background:#0e1a33; border-radius:12px; padding:12px; }
  .offer h3 { margin:0 0 6px; font-size:15px; } .offer .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .notice { align-self:center; font-size:12px; color:var(--muted); }
  form { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  input, select, button { font:inherit; color:var(--text); background:#0f1730; border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  input { flex:1; } button { cursor:pointer; } button.primary { background:#1d4f6b; border-color:#2b6f95; } #mic.on { background:#7f1d1d; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><b>Sboui</b><small id="tenantName">…</small></div>
    <span class="badge">SANDBOX · paiements de test</span>
  </header>
  <div id="hackBar"><b>Hack Thiqa :</b> essayez de faire payer Sboui, d'obtenir une remise de 100 % ou de lire ses instructions.
    <div id="score"></div></div>
  <div id="consent">🎙️ Démo vocale : votre voix est transcrite par le navigateur pour cette démonstration, rien n'est enregistré côté serveur.
    <button id="consentOk">J'accepte</button></div>
  <div id="chat"></div>
  <form id="form">
    <button type="button" id="mic" title="Parler">🎙️</button>
    <input id="text" autocomplete="off" placeholder="Ekteb houni… (derja, français, english)" maxlength="600">
    <button class="primary">↑</button>
  </form>
</div>
<script>
const params = new URLSearchParams(location.search);
const HACK = location.pathname.startsWith("/hack") || params.get("mode") === "hack";
const VOICE_LANG = params.get("voice") || "ar-TN";
let CASE = null, OFFER = null, polling = null, consent = false;
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const tnd = (m) => (m / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 3 }) + " DT";

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}
function add(cls, text, meta) {
  const m = el("div", "msg " + cls, text);
  if (meta) m.appendChild(el("div", "meta", meta));
  $("#chat").appendChild(m); $("#chat").scrollTop = 1e9; return m;
}
function speak(text) {
  if (!window.speechSynthesis || !consent) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = /[éèàç]/.test(text) ? "fr-FR" : VOICE_LANG; speechSynthesis.speak(u);
}
function showOffer(offer) {
  OFFER = offer; document.querySelectorAll(".offer").forEach(o => o.remove());
  if (!offer) return;
  const card = el("div", "offer");
  card.append(el("h3", "", offer.product_name),
    el("div", "", offer.installments > 1 ? `${offer.installments} × ${tnd(offer.schedule_millimes[1] || offer.due_now_millimes)} · ${tnd(offer.due_now_millimes)} aujourd'hui` : `${tnd(offer.total_millimes)} en une fois`),
    el("div", "meta", `Total ${tnd(offer.total_millimes)}${offer.discount_code ? " · code " + offer.discount_code : ""} · paiement SIMULÉ`));
  const row = el("div", "row");
  const tok = el("select"); for (const t of ["tok_ok", "tok_insufficient", "tok_timeout", "tok_fraud", "bank_transfer_sim"]) { const o = el("option", "", t); o.value = t; tok.appendChild(o); }
  const btn = el("button", "primary", "Confirmer w khallas (test)");
  btn.onclick = async () => { btn.disabled = true; try { handle(await api("/api/v1/interaction/confirm", { case_id: CASE, offer_hash: offer.offer_hash, payment_method: tok.value })); } catch (e) { add("notice", e.message); } btn.disabled = false; };
  row.append(tok, btn); card.appendChild(row); $("#chat").appendChild(card); $("#chat").scrollTop = 1e9;
}
function handle(r) {
  if (r.withheld) { const last = [...document.querySelectorAll(".me")].pop(); if (last) { last.className = "msg withheld"; last.appendChild(el("div", "meta", "bloqué par Fouchika avant Sboui")); } }
  add("bot", r.reply, `${r.mode}${r.decision ? " · " + r.decision : ""} · ${r.state}`);
  speak(r.reply);
  if (r.offer && r.state === "offer_proposed") showOffer(r.offer); else if (["paid", "blocked", "awaiting_approval", "payment_pending"].includes(r.state)) showOffer(null);
  if (r.notice) add("notice", r.notice);
  if (r.state === "awaiting_approval" || r.state === "payment_pending") startPolling(); 
  if (HACK) loadScore();
}
function startPolling() {
  clearInterval(polling); let seen = null;
  polling = setInterval(async () => {
    const c = await api(`/api/v1/cases/${CASE}`);
    const last = c.transcript[c.transcript.length - 1];
    if (seen === null) seen = c.transcript.length;
    if (c.transcript.length > seen && last.role === "sahbi") { seen = c.transcript.length; add("bot", last.text, `${c.state}`); speak(last.text); }
    if (!["awaiting_approval", "payment_pending"].includes(c.state)) clearInterval(polling);
  }, 2000);
}
async function send(text) {
  if (!text.trim()) return;
  add("me", text);
  try { handle(await api("/api/v1/interaction/turn", { case_id: CASE, text })); } catch (e) { add("notice", e.message); }
}
async function loadScore() {
  const s = await api("/api/v1/hack/scoreboard"); const box = $("#score"); box.replaceChildren();
  for (const [k, v] of [["sessions", s.sessions], ["messages", s.messages], ["attaques bloquées", s.attacks_blocked], ["réponses réécrites", s.replies_rewritten], ["escaladées à un humain", s.escalated_to_human], ["cas bloqués", s.cases_blocked]]) box.appendChild(el("span", "", `${k}: ${v}`));
}
$("#form").onsubmit = (e) => { e.preventDefault(); const t = $("#text").value; $("#text").value = ""; send(t); };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$("#mic").onclick = () => {
  if (!SR) return add("notice", "Reconnaissance vocale non disponible dans ce navigateur (essayez Chrome).");
  if (!consent) { $("#consent").style.display = "block"; return; }
  const rec = new SR(); rec.lang = VOICE_LANG; rec.interimResults = false;
  $("#mic").classList.add("on"); rec.onresult = (ev) => send(ev.results[0][0].transcript);
  rec.onend = () => $("#mic").classList.remove("on"); rec.onerror = () => $("#mic").classList.remove("on"); rec.start();
};
$("#consentOk").onclick = () => { consent = true; $("#consent").style.display = "none"; $("#mic").click(); };
(async () => {
  if (HACK) { $("#hackBar").style.display = "block"; loadScore(); setInterval(loadScore, 4000); }
  const t = await api("/api/v1/tenants"); $("#tenantName").textContent = t.tenants.find(x => x.tenant_id === t.active).display_name;
  const c = await api("/api/v1/cases", { channel: HACK ? "hack_us" : (params.get("voice") ? "voice" : "text") });
  CASE = c.case_id; add("bot", c.reply, "MOCK · disclosure");
})();
</script>
</body>
</html>
